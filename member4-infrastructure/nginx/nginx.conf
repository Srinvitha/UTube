events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    # Docker's internal DNS resolver.
    resolver 127.0.0.11 valid=30s;

    server {
        listen 80;
        server_name _;

        # Infrastructure health endpoint.
        location = /health {
            default_type application/json;
            return 200 '{"service":"utube-nginx","status":"UP"}';
        }

        # MinIO processed media.
        # During final integration, this can be changed to a CDN/object-storage
        # route if required.
        location /storage/ {
            proxy_pass http://minio:9000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Spring Boot backend.
        # Members 1 and 2 can integrate their backend/frontend services
        # using these service names.
        location /api/ {
            proxy_pass http://backend:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # React frontend.
        location / {
            proxy_pass http://frontend:5173;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
