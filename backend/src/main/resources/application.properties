spring.application.name=utube-backend

spring.datasource.url=jdbc:postgresql://localhost:5432/utube?options=-c%20TimeZone%3DAsia%2FKolkata
spring.datasource.username=utube_user
spring.datasource.password=change_me
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata
logging.level.org.springframework.security=DEBUG
server.port=8080

spring.servlet.multipart.max-file-size=2GB
spring.servlet.multipart.max-request-size=2GB

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=utube
spring.rabbitmq.password=change_me

utube.storage.endpoint=http://localhost:8333
utube.storage.access-key=
utube.storage.secret-key=
utube.storage.originals-bucket=utube-originals
utube.storage.processed-bucket=utube-processed
utube.storage.thumbnails-bucket=utube-thumbnails
